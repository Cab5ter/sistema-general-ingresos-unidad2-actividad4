type Account {
  id: ID!
  companyId: ID!
  accountType: AccountType!
  name: String!
  bankName: String
  accountNumber: String
  clabe: String
  cardLastDigits: String
  shortDescription: String
  longDescription: String
  isActive: Boolean!
  createdAt: Time!
  updatedAt: Time!
  company: Company!
}

type AccountBalance {
  accountId: ID!
  accountName: String!
  isActive: Boolean!
  openingBalance: Decimal!
  totalIncome: Decimal!
  totalExpense: Decimal!
  profit: Decimal!
  closingBalance: Decimal!
  isInRed: Boolean!
}

type AccountConcept {
  id: ID!
  accountId: ID!
  conceptId: ID!
  isActive: Boolean!
  createdAt: Time!
  account: Account!
  concept: Concept!
}

enum AccountType {
  DEBIT
  CREDIT
  CASH
  SAVINGS
  INVESTMENT
  WALLET
  OTHER
}

input AssignConceptToAccountInput {
  accountId: ID!
  conceptId: ID!
}

input AssignPermissionToRoleInput {
  roleId: ID!
  permissionId: ID!
}

input AssignRoleInput {
  companyUserId: ID!
  roleId: ID!
}

type AuthPayload {
  token: String!
  tokenType: String!
  user: AuthUser!
}

type AuthUser {
  id: ID!
  name: String!
  email: String!
}

type Company {
  id: ID!
  name: String!
  legalName: String
  taxId: String
  email: String
  phone: String
  isActive: Boolean!
  createdAt: Time!
  updatedAt: Time!
}

type CompanyUser {
  id: ID!
  companyId: ID!
  userId: ID!
  isAdmin: Boolean!
  isActive: Boolean!
  joinedAt: Time!
  company: Company!
  user: User!
}

type CompanyUserRole {
  id: ID!
  companyUser: CompanyUser!
  role: Role!
  isActive: Boolean!
}

type Concept {
  id: ID!
  companyId: ID!
  conceptType: ConceptType!
  name: String!
  shortDescription: String
  longDescription: String
  isActive: Boolean!
  createdAt: Time!
  updatedAt: Time!
}

enum ConceptType {
  INCOME
  EXPENSE
}

input CreateAccountInput {
  companyId: ID!
  accountType: AccountType!
  name: String!
  bankName: String
  accountNumber: String
  clabe: String
  cardLastDigits: String
  shortDescription: String
  longDescription: String
}

input CreateCompanyAdminInput {
  companyId: ID!
  name: String!
  email: String!
  password: String!
}

input CreateCompanyInput {
  name: String!
  legalName: String
  taxId: String
  email: String
  phone: String
}

input CreateCompanyUserInput {
  companyId: ID!
  name: String!
  email: String!
  password: String!
}

input CreateConceptInput {
  companyId: ID!
  conceptType: ConceptType!
  name: String!
  shortDescription: String
  longDescription: String
}

input CreatePermissionInput {
  code: String!
  name: String!
  description: String
}

input CreateRoleInput {
  code: String!
  name: String!
  description: String
}

input CreateTransactionInput {
  accountId: ID!
  conceptId: ID!
  transactionType: TransactionType!
  amount: Decimal!
  transactionDate: DateTime
  shortDescription: String
  longDescription: String
}

"""Date (isoformat)"""
scalar Date

scalar DateTime

scalar Decimal

type GeneralBalance {
  companyId: ID!
  currency: String!
  fromDate: Date!
  toDate: Date!
  openingBalance: Decimal!
  totalIncome: Decimal!
  totalExpense: Decimal!
  profit: Decimal!
  closingBalance: Decimal!
  isInRed: Boolean!
  accountsInRed: Int!
  accounts: [AccountBalance!]!
}

input LoginInput {
  email: String!
  password: String!
}

type Mutation {
  createAccount(input: CreateAccountInput!): Account!
  createConcept(input: CreateConceptInput!): Concept!
  assignConceptToAccount(input: AssignConceptToAccountInput!): AccountConcept!
  removeConceptFromAccount(accountId: ID!, conceptId: ID!): Boolean!
  createTransaction(input: CreateTransactionInput!): Transaction!
  deleteTransaction(id: ID!): Transaction!
  setRolePermissions(input: SetRolePermissionsInput!): RolePermissionUpdate
  createRole(input: CreateRoleInput!): Role!
  deactivateRole(id: ID!): Role!
  createPermission(input: CreatePermissionInput!): Permission!
  assignPermissionToRole(input: AssignPermissionToRoleInput!): RolePermission!
  removePermissionFromRole(roleId: ID!, permissionId: ID!): Boolean!
  assignRole(input: AssignRoleInput!): CompanyUserRole!
  createCompany(input: CreateCompanyInput!): Company!
  updateCompany(input: UpdateCompanyInput!): Company!
  deactivateCompany(id: ID!): Company!
  createCompanyAdmin(input: CreateCompanyAdminInput!): CompanyUser!
  createCompanyUser(input: CreateCompanyUserInput!): CompanyUser!
  deactivateCompanyUser(id: ID!): CompanyUser!
  login(input: LoginInput!): AuthPayload!
}

type Permission {
  id: ID!
  code: String!
  name: String!
  description: String
  isActive: Boolean!
}

enum PermissionResource {
  COMPANY_USERS
  ACCOUNTS
  CONCEPTS
  TRANSACTIONS
  ROLES
}

type Query {
  accounts(companyId: ID!, accountType: AccountType, activeOnly: Boolean): [Account!]!
  concepts(companyId: ID!, conceptType: ConceptType, activeOnly: Boolean): [Concept!]!
  accountConcepts(accountId: ID!): [AccountConcept!]!
  transactions(accountId: ID, transactionType: TransactionType, limit: Int, offset: Int): [Transaction!]!
  permissionCatalog(resource: PermissionResource): [Permission!]!
  previewRolePermissions(input: SetRolePermissionsInput!): RolePermissionPlan
  roles(activeOnly: Boolean): [Role!]!
  role(id: ID!): Role
  permissions(activeOnly: Boolean): [Permission!]!
  rolePermissions(roleId: ID!): [RolePermission!]!
  accountBalance(accountId: ID!, fromDate: Date!, toDate: Date!): AccountBalance!
  generalBalance(fromDate: Date!, toDate: Date!): GeneralBalance!
  companies(activeOnly: Boolean): [Company!]!
  company(id: ID!): Company
  companyUsers(companyId: ID!): [CompanyUser!]!
}

type Role {
  id: ID!
  code: String!
  name: String!
  description: String
  isActive: Boolean!
}

type RolePermission {
  id: ID!
  role: Role!
  permission: Permission!
  isActive: Boolean!
}

type RolePermissionPlan {
  role: Role!
  current: [Permission!]!
  toActivate: [Permission!]!
  toDeactivate: [Permission!]!
  unchanged: [Permission!]!
  finalCount: Int!
}

type RolePermissionUpdate {
  role: Role!
  activated: [Permission!]!
  deactivated: [Permission!]!
  unchanged: [Permission!]!
  finalCount: Int!
  changed: Boolean!
}

input SetRolePermissionsInput {
  roleId: ID!
  permissionIds: [ID!]!
}

scalar Time

type Transaction {
  id: ID!
  accountId: ID!
  conceptId: ID!
  transactionType: TransactionType!
  amount: Decimal!
  transactionDate: DateTime!
  capturedAt: DateTime!
  capturedBy: ID!
  shortDescription: String
  longDescription: String
  isActive: Boolean!
  createdAt: Time!
  updatedAt: Time!
  account: Account!
  concept: Concept!
  capturedByUser: User!
}

enum TransactionType {
  INCOME
  EXPENSE
}

input UpdateCompanyInput {
  id: ID!
  name: String
  legalName: String
  taxId: String
  email: String
  phone: String
  isActive: Boolean
}

type User {
  id: ID!
  name: String!
  email: String!
  emailVerified: Boolean!
  isActive: Boolean!
  createdAt: Time!
  updatedAt: Time!
}
