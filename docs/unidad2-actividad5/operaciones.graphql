query PuntoDePartida {
  roles { id code isActive }
  permissions { id code isActive }
}
query ExplorarCatalogo {
  cuentas: permissionCatalog(resource: ACCOUNTS) { ...DatosPermiso }
  movimientos: permissionCatalog(resource: TRANSACTIONS) { ...DatosPermiso }
}
fragment DatosPermiso on Permission { id code name }
query CatalogoCompleto($resource: PermissionResource) {
  permissionCatalog(resource: $resource) { id code name }
}
query RevisarConfiguracion($input: SetRolePermissionsInput!) {
  previewRolePermissions(input: $input) {
    role { code } current { code } toActivate { code } toDeactivate { code }
    unchanged { code } finalCount
  }
}
mutation AplicarConfiguracion($input: SetRolePermissionsInput!) {
  setRolePermissions(input: $input) {
    role { code } activated { code } deactivated { code } unchanged { code } finalCount changed
  }
}
query ConsultarCuentas($company: ID!) {
  accounts(companyId: $company) { id companyId name }
}
mutation RegistrarMovimiento($input: CreateTransactionInput!) {
  createTransaction(input: $input) { id accountId conceptId amount capturedBy }
}
